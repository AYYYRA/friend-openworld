<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>friend. · openworld — 两版官网</title>
<meta name="description" content="friend. 官网两版：手绘线稿白纸版，与白纸灰底团队圆环版。">
<style>
  :root{
    --ink:#151515; --muted:#6a6a6a; --line:rgba(21,21,21,.14);
    --paper:#f7f7f5; --card:#fff; --ease:cubic-bezier(.22,.75,.25,1);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; padding:48px 24px 64px;
    background:var(--paper); color:var(--ink);
    font-family:"Segoe UI","Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    font-weight:300; -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:100svh;
  }
  header{text-align:center; max-width:720px; margin-bottom:44px}
  .wordmark{font-size:clamp(38px,7vw,64px); font-weight:200; letter-spacing:-.03em; line-height:1; margin:0}
  .wordmark span{opacity:.45}
  .tagline{margin:16px 0 0; color:var(--muted); font-size:15px; letter-spacing:.02em}
  .grid{
    display:grid; gap:22px; width:100%; max-width:960px;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  }
  a.card{
    position:relative; display:flex; flex-direction:column; gap:14px;
    padding:26px 26px 22px; border:1px solid var(--line); border-radius:14px;
    background:var(--card); color:inherit; text-decoration:none;
    transition:transform .28s var(--ease), box-shadow .28s var(--ease), border-color .28s var(--ease);
  }
  a.card:hover, a.card:focus-visible{
    transform:translateY(-4px); border-color:rgba(21,21,21,.32);
    box-shadow:0 18px 40px rgba(0,0,0,.10); outline:none;
  }
  a.card:focus-visible{box-shadow:0 0 0 3px rgba(21,21,21,.18),0 18px 40px rgba(0,0,0,.10)}
  .kicker{font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted)}
  .title{font-size:22px; font-weight:400; letter-spacing:-.01em; margin:0}
  .desc{margin:0; color:var(--muted); font-size:14px; line-height:1.65}
  .meta{margin-top:auto; padding-top:14px; border-top:1px solid var(--line);
        display:flex; justify-content:space-between; align-items:center;
        font-size:12px; color:var(--muted)}
  .arrow{transition:transform .28s var(--ease)}
  a.card:hover .arrow{transform:translateX(4px)}
  .swatch{height:86px; border-radius:8px; display:flex; align-items:center; justify-content:center;
          font-size:12px; color:var(--muted); letter-spacing:.08em}
  .swatch.ink{background:#fff; border:1px dashed rgba(21,21,21,.28)}
  .swatch.gray{background:#9f9f9f}
  footer{margin-top:52px; font-size:12px; color:var(--muted); text-align:center; line-height:1.9}
  footer a{color:inherit}
  @media (prefers-reduced-motion:reduce){
    a.card, .arrow{transition:none}
    a.card:hover{transform:none}
  }
</style>
</head>
<body>
  <header>
    <h1 class="wordmark">friend<span>.</span></h1>
    <p class="tagline">openworld · 官网两版对照</p>
  </header>

  <main class="grid">
    <a class="card" href="./handdrawn/">
      <span class="kicker">Version A</span>
      <h2 class="title">手绘线稿 · 白纸版</h2>
      <p class="desc">黑色线稿插画、书册翻页、深色固定页脚与全局可点光标。交互最完整的一版。</p>
      <div class="swatch ink">hand-drawn line art</div>
      <div class="meta"><span>friend. — your personal data wallet</span><span class="arrow">→</span></div>
    </a>

    <a class="card" href="./paper-gray/">
      <span class="kicker">Version B</span>
      <h2 class="title">白纸灰底 · 团队圆环版</h2>
      <p class="desc">灰底衬托白纸舞台，团队成员沿圆环排布，点击展开成员详情。带开场动画。</p>
      <div class="swatch gray">#9f9f9f backdrop</div>
      <div class="meta"><span>openworld</span><span class="arrow">→</span></div>
    </a>
  </main>

  <footer>
    纯静态页面，无需服务端。仓库：<a href="https://github.com/AYYYRA/friend-openworld" target="_blank" rel="noreferrer">AYYYRA/friend-openworld</a>
  </footer>
</body>
</html>
