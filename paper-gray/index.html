<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#9f9f9f" />
    <meta name="description" content="openworld" />
    <title>openworld</title>
    <style>
:root {
  color-scheme: light;
  --paper: #ffffff;
  --backdrop: #9f9f9f;
  --ink: #171717;
  --muted: #666666;
  --faint: #d8d8d8;
  --focus: #171717;
  --ease: cubic-bezier(0.22, 0.75, 0.25, 1);
  font-family: "HarmonyOS Sans SC", "HarmonyOS Sans", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  font-synthesis: none;
}

* {
  box-sizing: border-box;
}

html {
  background: var(--backdrop);
}

body {
  min-height: 100svh;
  margin: 0;
  overflow: hidden;
  background: var(--backdrop);
  color: var(--ink);
  font-weight: 300;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overscroll-behavior: none;
}

button,
a,
[tabindex] {
  -webkit-tap-highlight-color: transparent;
}

button {
  font: inherit;
}

.site-shell {
  min-height: 100svh;
  display: grid;
  place-items: center;
  padding: 24px 25px;
  overflow: hidden;
}

.stage-frame {
  position: relative;
  flex: 0 0 auto;
  width: 990px;
  height: 620px;
}

.stage {
  position: relative;
  display: flex;
  flex-direction: column;
  width: 990px;
  height: 620px;
  min-height: 0;
  overflow: hidden;
  background: var(--paper);
  box-shadow: var(--paper-shadow, 0 20px 42px rgba(0, 0, 0, 0.18));
  transform-origin: top left;
}

.stage > .language-hotspot,
.stage > .content-zone,
.stage > .nav-zone {
  opacity: 1;
  transition: opacity 620ms ease;
}

.stage.intro-active > :not(.intro-screen) {
  opacity: 0;
  pointer-events: none;
}

.stage.intro-leaving > .content-zone {
  transition-delay: 100ms;
}

.stage.intro-leaving > .nav-zone {
  transition-delay: 180ms;
}

.stage.intro-leaving > .language-hotspot {
  transition-delay: 240ms;
}

.intro-screen {
  position: absolute;
  inset: 0;
  z-index: 10;
  display: grid;
  place-items: center;
  background: var(--paper);
  opacity: 1;
  transition: opacity 1140ms ease;
}

.intro-screen.is-dismissed {
  opacity: 0;
  pointer-events: none;
}

.intro-mark {
  position: relative;
  width: 230px;
  height: 145px;
  /* The prototype places the mark slightly above the frame's optical center. */
  transform: translateY(-38px);
  opacity: 1;
  transition: opacity 460ms ease, transform 620ms var(--ease);
}

.intro-screen.is-dismissed .intro-mark {
  opacity: 0;
  transform: translateY(-45px);
}

.intro-arc {
  position: absolute;
  inset: 0;
  width: 230px;
  height: 145px;
  overflow: visible;
  pointer-events: none;
}

.intro-arc__left,
.intro-arc__right {
  opacity: 0;
  fill: none;
  stroke: white;
  stroke-dasharray: 1;
  stroke-dashoffset: 1;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-width: 14px;
  animation: intro-arc-draw 2475ms var(--ease) 1120ms forwards;
}

.intro-logo {
  display: block;
  width: 230px;
  height: 145px;
  object-fit: contain;
  opacity: 0;
  /* The lower crop is the same source image, so the completed mark never changes geometry. */
  clip-path: inset(98px 0 0 0);
  animation: intro-wordmark-reveal 780ms ease 3640ms forwards;
}

.intro-hint {
  position: absolute;
  bottom: 8.5%;
  left: 0;
  width: 100%;
  margin: 0;
  color: var(--muted);
  font-size: 12px;
  letter-spacing: 0.08em;
  text-align: center;
  opacity: 0;
  transition: opacity 300ms ease;
}

.team-scene {
  position: relative;
  width: 740px;
  height: 360px;
  margin: 0 auto;
}

.team-roster {
  position: absolute;
  inset: 0;
  width: 620px;
  height: 360px;
  margin: auto;
}

.team-orbit {
  position: absolute;
  inset: 0;
  transform: rotate(var(--orbit-angle, 0deg));
  transform-origin: center;
}

.team-member {
  position: absolute;
  width: max-content;
  padding: 8px 12px;
  border: 0;
  background: transparent;
  color: var(--ink);
  cursor: pointer;
  font-size: 17px;
  font-weight: 300;
  line-height: 1.1;
  transform: translate(-50%, -50%) rotate(var(--counter-angle, 0deg));
  transition: opacity 520ms ease, color 180ms ease;
}

.team-member > span {
  display: block;
  transition: transform 180ms ease;
}

.team-scene.is-opening .team-member:not(.team-member--selected),
.team-scene.is-closing:not(.is-returning) .team-member:not(.team-member--selected) {
  opacity: 0;
}

.team-scene.is-closing:not(.is-returning) .team-member:not(.team-member--selected) {
  /* Establish the hidden baseline before the reverse fade is enabled. */
  transition: none;
}

.team-scene.is-detail .team-roster {
  visibility: hidden;
}

.team-scene.is-opening .team-member,
.team-scene.is-closing .team-member {
  pointer-events: none;
}

.team-scene:not(.is-opening):not(.is-closing) .team-member:hover,
.team-scene:not(.is-opening):not(.is-closing) .team-member:focus-visible {
  color: #000;
}

.team-scene:not(.is-opening):not(.is-closing) .team-member:hover > span,
.team-scene:not(.is-opening):not(.is-closing) .team-member:focus-visible > span {
  transform: scale(1.08);
}

.team-member:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 4px;
}

.member-detail {
  display: grid;
  justify-items: center;
  gap: 15px;
  max-width: 670px;
  margin: 0 auto;
  text-align: center;
}

.team-detail-layer {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  visibility: hidden;
  pointer-events: none;
}

.team-detail-layer.is-mounted {
  visibility: visible;
}

.team-detail-layer .member-detail {
  width: 670px;
}

.team-name-flight {
  position: absolute;
  z-index: 7;
  width: max-content;
  margin: 0;
  color: var(--ink);
  white-space: nowrap;
  pointer-events: none;
  transform: translate(-50%, -50%);
  transform-origin: center;
  will-change: left, top, font-size, letter-spacing;
}

.member-detail__role {
  margin: -2px 0 4px;
  color: var(--muted);
  font-size: 15px;
  line-height: 1.4;
  opacity: 0;
  transform: translateY(7px);
  transition: opacity 420ms ease, transform 520ms var(--ease);
}

.member-detail__lines {
  display: grid;
  gap: 5px;
  max-width: 620px;
}

.member-detail__lines p {
  margin: 0;
  color: #4b4b4b;
  font-size: 18px;
  line-height: 1.5;
  opacity: 0;
  transform: translateY(7px);
  transition: opacity 420ms ease, transform 520ms var(--ease);
}

.team-detail-layer.is-revealed .member-detail__role,
.team-detail-layer.is-revealed .member-detail__lines p {
  opacity: 1;
  transform: translateY(0);
}

.team-detail-layer.is-revealed .member-detail__role { transition-delay: 60ms; }
.team-detail-layer.is-revealed .member-detail__lines p:nth-child(1) { transition-delay: 100ms; }
.team-detail-layer.is-revealed .member-detail__lines p:nth-child(2) { transition-delay: 160ms; }
.team-detail-layer.is-revealed .member-detail__lines p:nth-child(3) { transition-delay: 220ms; }
.team-detail-layer.is-revealed .member-detail__lines p:nth-child(4) { transition-delay: 280ms; }

.content-zone {
  position: relative;
  display: grid;
  flex: 1 1 auto;
  min-height: 0;
  place-items: center;
  padding: 72px 80px 32px;
  outline: none;
  touch-action: pan-y;
  user-select: none;
}

.content-zone:focus-visible {
  box-shadow: inset 0 0 0 2px var(--focus);
}

.content-view {
  position: relative;
  top: -28px;
  width: min(100%, 740px);
  text-align: center;
  animation: content-in 780ms var(--ease) both;
}

.content-view--ideal {
  top: -60px;
}

.content-view--team {
  top: -54px;
}

.content-view.is-exiting {
  animation: content-out 180ms ease both;
}

.manifesto {
  display: grid;
  gap: 0.08em;
  max-width: 720px;
  margin: 0 auto;
  color: var(--ink);
  font-size: 18px;
  line-height: 1.22;
  letter-spacing: 0.01em;
}

.manifesto p {
  margin: 0;
}

.manifesto--english {
  max-width: 710px;
  gap: 0.06em;
  font-size: 17px;
  line-height: 1.2;
}

.slide {
  display: grid;
  justify-items: center;
  gap: 18px;
  max-width: 660px;
  margin: 0 auto;
}

.slide__eyebrow {
  display: none;
}

.slide__title {
  margin: 0;
  font-size: 22px;
  font-weight: 300;
  letter-spacing: 0;
  line-height: 1.1;
}

.content-zone::before,
.content-zone::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  z-index: 2;
  height: 54px;
  pointer-events: none;
}

.content-zone::before {
  top: 0;
  background: linear-gradient(to bottom, #fff 0%, rgba(255, 255, 255, 0.92) 42%, rgba(255, 255, 255, 0) 100%);
}

.content-zone::after {
  bottom: 0;
  background: linear-gradient(to top, #fff 0%, rgba(255, 255, 255, 0.92) 42%, rgba(255, 255, 255, 0) 100%);
}

.product-download {
  display: grid;
  gap: 30px;
  justify-items: center;
  margin-top: 38px;
}

.product-download__title {
  margin: 0;
  font-size: 22px;
  font-weight: 300;
}

.product-download__links {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 54px;
}

.product-download__links a {
  color: #777;
  font-size: 19px;
  font-weight: 200;
  text-decoration: none;
  transition: color 840ms ease;
}

.product-download__links a:hover,
.product-download__links a:focus-visible {
  color: #111;
}

.contact-status {
  margin-top: 20px;
  color: #777;
  font-size: 14px;
  opacity: 0;
  transition: opacity 840ms ease;
}

.contact-status.is-visible {
  opacity: 1;
}

.slide__body {
  max-width: 610px;
  margin: 0;
  color: #4b4b4b;
  font-size: 18px;
  line-height: 1.45;
  white-space: pre-line;
}

.slide__body em {
  color: var(--ink);
  font-style: normal;
}

.slide__links {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px 28px;
  margin-top: 7px;
}

.slide__link {
  color: var(--ink);
  font-size: 15px;
  line-height: 1.4;
  text-decoration: underline;
  text-decoration-color: #b7b7b7;
  text-decoration-thickness: 1px;
  text-underline-offset: 5px;
  transition: color 180ms ease, text-decoration-color 180ms ease;
}

.slide__link:hover,
.slide__link:focus-visible {
  color: #000;
  text-decoration-color: var(--ink);
}

.contact-canvas {
  position: relative;
  width: min(100%, 520px);
  min-height: 170px;
  margin: 0 auto;
  padding: 71px 0;
  outline: none;
  caret-color: transparent;
  color: var(--ink);
  font-size: 18px;
  line-height: 1.5;
  text-align: center;
  white-space: pre-wrap;
  user-select: text;
}

.contact-canvas::after {
  content: "";
  position: absolute;
  top: 50%;
  left: 50%;
  display: block;
  width: 1px;
  height: 1.15em;
  background: var(--ink);
  transform: translate(-50%, -50%);
  animation: caret-blink 1.05s step-end infinite;
}

.contact-canvas--has-input {
  caret-color: var(--ink);
}

.contact-canvas--has-input::after {
  display: none;
}

.nav-zone {
  flex: 0 0 22%;
  min-height: 112px;
  display: flex;
  align-items: flex-end;
  padding: 0 80px 72px;
}

.nav-track {
  position: relative;
  display: block;
  width: 100%;
  height: 48px;
  overflow: visible;
  scrollbar-width: none;
}

.nav-track::-webkit-scrollbar {
  display: none;
}

.nav-link {
  position: absolute;
  top: 0;
  left: 50%;
  width: max-content;
  padding: 8px 0 11px;
  border: 0;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  font-size: 21px;
  font-weight: 200;
  letter-spacing: 0;
  line-height: 1;
  transform: translateX(calc(-50% + var(--shift))) translateY(var(--lift)) scale(var(--scale));
  transform-origin: center bottom;
  opacity: var(--opacity);
  transition: color 840ms ease;
}

.nav-link--edge-fade {
  opacity: 0 !important;
  pointer-events: none;
}

.nav-link--repositioning {
  transition: none !important;
}

.nav-track--instant .nav-link {
  transition: none;
}

.nav-link:hover,
.nav-link:focus-visible,
.nav-link[aria-current="page"] {
  color: var(--ink);
}

.nav-link[aria-current="page"] {
  color: var(--ink);
}

.nav-link:focus-visible,
.language-button:focus-visible,
.language-hotspot:focus-visible,
.slide__link:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 5px;
}

.language-hotspot {
  position: absolute;
  z-index: 3;
  top: 0;
  right: 0;
  width: 98px;
  height: 78px;
  outline: none;
}

.language-control {
  position: absolute;
  top: 30px;
  right: 40px;
  transition: opacity 250ms ease, transform 250ms var(--ease);
}

.language-control.is-hidden {
  opacity: 0;
  pointer-events: none;
  transform: translateY(-5px);
}

.language-control.is-revealed {
  opacity: 1;
  pointer-events: auto;
  transform: translateY(0);
}

.language-button {
  padding: 4px 0;
  border: 0;
  background: transparent;
  color: var(--ink);
  cursor: pointer;
  font-size: 15px;
  font-weight: 300;
  letter-spacing: 0.01em;
  line-height: 1;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

@keyframes content-in {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes content-out {
  from {
    opacity: 1;
    transform: translateY(0);
  }
  to {
    opacity: 0;
    transform: translateY(-6px);
  }
}

@keyframes caret-blink {
  0%,
  45% {
    opacity: 1;
  }
  46%,
  100% {
    opacity: 0;
  }
}

@keyframes intro-arc-draw {
  0% {
    opacity: 0;
    stroke-dashoffset: 1;
  }
  2% {
    opacity: 1;
  }
  100% {
    opacity: 1;
    stroke-dashoffset: 0;
  }
}

@keyframes intro-wordmark-reveal {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}

@keyframes detail-line-in {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    transition-duration: 0.01ms !important;
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
  }
}

<script>
/* 统一加载遮罩：资源就绪后才放行渲染，避免网络波动导致的提前渲染。
   纯内联、无外部依赖；放在 <head> 末尾、<body> 之前注入。
   放行条件：window load + document.fonts.ready + 所有 img decode 完成。
   兜底：最长 8000ms 强制放行，绝不把页面锁死。 */
(function () {
  var CONFIG = {
    bg: '#9f9f9f',
    fg: '#ffffff',
    accent: 'rgba(255,255,255,.28)',
    label: 'loading',
    minShow: 640,   // 最短展示时长(ms)，避免一闪而过
    timeout: 10000    // 兜底放行(ms)
  };

  var root = document.documentElement;
  var start = Date.now();
  var done = false;
  var frozen = [];

  /* 注入样式：遮罩层本身极轻薄，不依赖任何图片或字体 */
  var css = document.createElement('style');
  css.id = 'boot-veil-style';
  css.textContent =
    'html.__boot{overflow:hidden!important;}' +
    'html.__boot body{overflow:hidden!important;}' +
    '#boot-veil{position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;' +
      'justify-content:center;flex-direction:column;gap:26px;background:' + CONFIG.bg + ';' +
      'color:' + CONFIG.fg + ';font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif;' +
      'font-weight:300;-webkit-font-smoothing:antialiased;' +
      'transition:opacity .62s cubic-bezier(.22,.75,.25,1);will-change:opacity;}' +
    '#boot-veil.__gone{opacity:0;pointer-events:none;}' +
    '#boot-veil .__mark{font-size:clamp(30px,5vw,44px);letter-spacing:-.03em;line-height:1;' +
      'opacity:.92;transition:opacity .5s ease;}' +
    '#boot-veil .__mark i{font-style:normal;opacity:.45;}' +
    '#boot-veil .__track{position:relative;width:min(190px,42vw);height:1px;' +
      'background:' + CONFIG.accent + ';overflow:hidden;}' +
    '#boot-veil .__bar{position:absolute;inset:0 100% 0 0;background:' + CONFIG.fg + ';' +
      'transition:right .42s cubic-bezier(.22,.75,.25,1);}' +
    '#boot-veil .__label{font-size:11px;letter-spacing:.22em;text-transform:uppercase;opacity:.5;}' +
    '@media (prefers-reduced-motion:reduce){#boot-veil,#boot-veil .__bar{transition-duration:.01ms!important;}}';

  /* 遮罩 DOM 必须在 <body> 出现前就绪，否则可能先闪一帧页面内容 */
  var veil = document.createElement('div');
  veil.id = 'boot-veil';
  veil.setAttribute('role', 'status');
  veil.setAttribute('aria-live', 'polite');
  veil.setAttribute('aria-label', CONFIG.label);
  veil.innerHTML =
    '<div class="__mark">friend<i>.</i></div>' +
    '<div class="__track"><div class="__bar"></div></div>' +
    '<div class="__label">' + CONFIG.label + '</div>';

  root.classList.add('__boot');
  (document.head || root).appendChild(css);

  /* 进度：粗粒度分段，不假装精确，只表达"在动" */
  var bar = veil.querySelector('.__bar');
  var pct = 0;
  function setProgress(p) {
    pct = Math.max(pct, Math.min(p, 0.94)); // 收尾前最多到 94%
    bar.style.right = (100 - pct * 100) + '%';
  }
  setProgress(0.12);

  /* 加载期间冻结 CSS 动画，避免动画在遮罩后面跑完、揭幕时已经是尾部状态 */
  function freeze() {
    if (!document.getAnimations) return;
    var list = document.getAnimations();
    for (var i = 0; i < list.length; i++) {
      var a = list[i];
      try {
        if (a.playState === 'running' || a.playState === 'pending') {
          a.pause();
          frozen.push(a);
        }
      } catch (e) { /* 单个动画不可控就跳过，不影响整体 */ }
    }
  }
  function thaw() {
    for (var i = 0; i < frozen.length; i++) {
      try { frozen[i].play(); } catch (e) { /* 已失效的动画忽略 */ }
    }
    frozen.length = 0;
  }

  /* 等待所有图片解码完成；decode() 失败也算完成，不能因为一张图卡住整页 */
  function imagesReady() {
    var imgs = document.images ? Array.prototype.slice.call(document.images) : [];
    if (!imgs.length) return Promise.resolve();
    return Promise.all(imgs.map(function (img) {
      if (img.complete && img.naturalWidth > 0) {
        return (img.decode ? img.decode() : Promise.resolve()).catch(function () {});
      }
      return new Promise(function (resolve) {
        img.addEventListener('load', function () {
          (img.decode ? img.decode() : Promise.resolve()).then(resolve).catch(resolve);
        }, { once: true });
        img.addEventListener('error', resolve, { once: true });
      });
    }));
  }

  function fontsReady() {
    if (!document.fonts || !document.fonts.ready) return Promise.resolve();
    return Promise.resolve(document.fonts.ready).catch(function () {});
  }

  function release(reason) {
    if (done) return;
    done = true;

    var wait = Math.max(0, CONFIG.minShow - (Date.now() - start));
    setTimeout(function () {
      setProgress(1);
      veil.classList.add('__gone');
      root.classList.remove('__boot');
      thaw();                                  // 让页面自己从头开始播
      setTimeout(function () {
        if (veil.parentNode) veil.parentNode.removeChild(veil);
        if (css.parentNode) css.parentNode.removeChild(css);
        root.classList.remove('__boot');
      }, 680);
      try {
        window.dispatchEvent(new CustomEvent('boot:ready', { detail: { reason: reason } }));
      } catch (e) { /* 老浏览器忽略 */ }
    }, wait);
  }

  /* 逐段推进，让进度条有真实节奏而不是空转 */
  var steps = [0.32, 0.58, 0.79];
  var stepTimer = setInterval(function () {
    var next = steps.shift();
    if (next === undefined) return clearInterval(stepTimer);
    setProgress(next);
  }, 260);

  function whenReady() {
    freeze();
    var ticker = setInterval(freeze, 120);   // 期间新产生的动画也一并冻结
    Promise.all([fontsReady(), imagesReady()])
      .then(function () { clearInterval(ticker); setProgress(0.94); release('loaded'); })
      .catch(function () { clearInterval(ticker); release('fallback'); });
  }

  // DOM 就绪后就开始冻结（此时 CSS 动画已存在，但尚未跑远）
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', freeze, { once: true });
  } else {
    freeze();
  }

  if (document.readyState === 'complete') {
    // 从缓存回来时 load 可能早已触发
    whenReady();
  } else {
    window.addEventListener('load', whenReady, { once: true });
  }

  // 兜底：任何异常都不允许把页面锁死
  setTimeout(function () { clearInterval(stepTimer); release('timeout'); }, CONFIG.timeout);

  // 把遮罩挂到 body 上。脚本在 <head> 里执行时 body 还不存在，等解析到即可。
  function mount() {
    if (document.body) {
      document.body.insertBefore(veil, document.body.firstChild);
      return true;
    }
    return false;
  }
  if (!mount()) {
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', mount, { once: true });
    } else {
      mount();
    }
  }
})();

</script>

    return sections.includes(candidate) ? candidate : null;
  }

  function navOrder() {
    return sections;
  }

  function currentSlides() {
    if (activeSection === "team") {
      return [{ type: "team-roster" }];
    }
    if (activeSection === "contact") {
      return [{ type: "contact" }];
    }
    return copy[locale].slides[activeSection] || [];
  }

  function announce(message) {
    const node = document.querySelector("#interaction-hint");
    if (!node) return;
    node.textContent = message;
  }

  function pageAnnouncement(section, page) {
    return locale === "zh"
      ? `${sectionLabels[locale][section]}，第 ${page} 页`
      : `${sectionLabels[locale][section]}, page ${page}`;
  }

  function syncStaticLabels() {
    const labels = copy[locale].ui;
    document.documentElement.lang = locale === "zh" ? "zh-CN" : "en";
    document.querySelector(".site-shell")?.setAttribute("aria-label", labels.mainAria);
    document.querySelector("#intro-screen")?.setAttribute("aria-label", labels.introAria);
    languageHotspot.setAttribute("aria-label", labels.languageHotspotAria);
    contentZone.setAttribute("aria-label", labels.contentAria);
    navZone.setAttribute("aria-label", labels.navAria);
    introHint.textContent = labels.introHint;
    const interactionHint = document.querySelector("#interaction-hint");
    if (interactionHint) interactionHint.textContent = labels.interactionHint;
  }

  function navigationStep() {
    const trackWidth = navTrack.clientWidth || 840;
    return Math.min(174, Math.max(82, trackWidth / 5));
  }

  function applyNavigationSlot(button, slot, step) {
    const level = navLevels[Math.abs(slot)];
    button.dataset.slot = String(slot);
    button.dataset.offset = String(slot);
    button.style.setProperty("--shift", `${slot * step}px`);
    button.style.setProperty("--scale", level.scale);
    button.style.setProperty("--opacity", level.opacity);
    button.style.setProperty("--lift", level.lift);
    button.style.zIndex = String(3 - Math.abs(slot));
  }

  function ensureNavigationButtons() {
    const buttons = [...navTrack.querySelectorAll(".nav-link")];
    while (buttons.length < navSlots.length) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "nav-link";
      button.addEventListener("click", () => {
        if (button.dataset.section) setSection(button.dataset.section);
      });
      navTrack.appendChild(button);
      buttons.push(button);
    }
    return buttons.slice(0, navSlots.length).map((button, index) => {
      button.dataset.section = sections[index];
      button.textContent = sectionLabels[locale][sections[index]];
      return button;
    });
  }

  function normalizeNavigationDelta(fromIndex, toIndex, length) {
    const rawDelta = toIndex - fromIndex;
    if (rawDelta > length / 2) return rawDelta - length;
    if (rawDelta < -length / 2) return rawDelta + length;
    return rawDelta;
  }

  function visualNavigationSection() {
    return navAnimationState === NAV_STATE.MOVING
      ? navTransitionTarget
      : (navRenderedSection || activeSection);
  }

  function navigationSlot(section, centerSection) {
    const order = navOrder();
    return normalizeNavigationDelta(order.indexOf(centerSection), order.indexOf(section), order.length);
  }

  function navigationTransform(slot, step) {
    const level = navLevels[Math.abs(slot)];
    return `translateX(calc(-50% + ${slot * step}px)) translateY(${level.lift}) scale(${level.scale})`;
  }

  function syncNavigationButtons(buttons, centerSection, step) {
    buttons.forEach((button) => {
      const section = button.dataset.section;
      const slot = navigationSlot(section, centerSection);
      button.textContent = sectionLabels[locale][section];
      button.setAttribute("aria-current", section === centerSection ? "page" : "false");
      applyNavigationSlot(button, slot, step);
      button.classList.remove("nav-link--edge-fade", "nav-link--repositioning");
    });
  }

  function refreshNavigationLabels(buttons) {
    const visualSection = visualNavigationSection();
    buttons.forEach((button) => {
      button.textContent = sectionLabels[locale][button.dataset.section];
      button.setAttribute("aria-current", button.dataset.section === visualSection ? "page" : "false");
    });
  }

  async function startNavigationTransition() {
    if (navAnimationState !== NAV_STATE.IDLE || navRenderedSection === navQueuedSection) return;
    const buttons = ensureNavigationButtons();
    const step = navigationStep();
    const targetSection = navQueuedSection;
    navTransitionTarget = targetSection;
    navAnimationState = NAV_STATE.MOVING;
    navTrack.classList.add("nav-track--animating");

    navAnimations = buttons.map((button) => {
      const section = button.dataset.section;
      const fromSlot = Number(button.dataset.slot);
      const toSlot = navigationSlot(section, targetSection);
      const fromLevel = navLevels[Math.abs(fromSlot)];
      const toLevel = navLevels[Math.abs(toSlot)];
      const wrapped = Math.abs(toSlot - fromSlot) > 2;
      const fromTransform = navigationTransform(fromSlot, step);
      const toTransform = navigationTransform(toSlot, step);
      button.setAttribute("aria-current", section === targetSection ? "page" : "false");
      applyNavigationSlot(button, toSlot, step);

      if (reduceMotion.matches || typeof button.animate !== "function") return null;
      const keyframes = wrapped
        ? [
            { transform: fromTransform, opacity: fromLevel.opacity, offset: 0 },
            { transform: fromTransform, opacity: 0, offset: 0.38 },
            { transform: toTransform, opacity: 0, offset: 0.62 },
            { transform: toTransform, opacity: toLevel.opacity, offset: 1 }
          ]
        : [
            { transform: fromTransform, opacity: fromLevel.opacity },
            { transform: toTransform, opacity: toLevel.opacity }
          ];
      return button.animate(keyframes, {
        duration: navTransitionDuration,
        easing: wrapped ? "ease-in-out" : "cubic-bezier(0.22, 0.75, 0.25, 1)",
        fill: "both"
      });
    }).filter(Boolean);

    await Promise.all(navAnimations.map((animation) => animation.finished.catch(() => undefined)));
    navAnimations.forEach((animation) => animation.cancel());
    navAnimations = [];
    navRenderedSection = targetSection;
    navTransitionTarget = null;
    navAnimationState = NAV_STATE.IDLE;
    navTrack.classList.remove("nav-track--animating");
    syncNavigationButtons(buttons, navRenderedSection, step);
    if (navRenderedSection !== navQueuedSection) startNavigationTransition();
  }

  function renderNavigation() {
    const buttons = ensureNavigationButtons();
    const step = navigationStep();
    navQueuedSection = activeSection;
    refreshNavigationLabels(buttons);

    if (navRenderedSection === null) {
      navRenderedSection = activeSection;
      syncNavigationButtons(buttons, navRenderedSection, step);
      return;
    }
    if (navAnimationState === NAV_STATE.IDLE) startNavigationTransition();
  }

  function renderContent(direction) {
    const slides = currentSlides();
    if (!slides.length) return;
    resetTeamTransition();
    slideIndex = Math.max(0, Math.min(slideIndex, slides.length - 1));
    const slide = slides[slideIndex];
    const next = document.createElement("div");
    next.className = `content-view content-view--${activeSection}${activeSection === "team" ? " content-view--team" : ""}`;
    next.id = "content-view";
    next.setAttribute("aria-live", "polite");
    next.innerHTML = slideMarkup(slide);
    if (direction && !reduceMotion.matches) {
      next.style.setProperty("--slide-direction", direction > 0 ? "1" : "-1");
    }
    stopTeamOrbit();
    contentView.replaceWith(next);
    contentView = next;
    bindDynamicContent();
    if (activeSection === "team" && teamDetailOpen) showTeamDetailInstant(teamMemberIndex);
    else if (activeSection === "team" && introPhase === "open") startTeamOrbit();
  }

  function slideMarkup(slide) {
    if (slide.type === "ideal-statement" || slide.type === "work-scenario") {
      const className = locale === "en" ? "manifesto manifesto--english" : "manifesto";
      const lines = slide.type === "ideal-statement" ? copy[locale].idealStatement : copy[locale].workScenario;
      return `<div class="${className}">${lines.map((line) => `<p>${escapeHtml(line)}</p>`).join("")}</div>`;
    }
    if (slide.type === "contact") {
      const inputState = contactDraft.trim() ? " contact-canvas--has-input" : "";
      return `<div class="contact-canvas${inputState}" contenteditable="true" role="textbox" aria-label="${escapeHtml(copy[locale].contactAria)}" dir="auto">${escapeHtml(contactDraft)}</div>`;
    }
    if (slide.type === "team-roster") {
      return `<section class="team-scene" data-team-state="roster"><div class="team-roster" aria-label="${locale === "zh" ? "团队成员" : "Team members"}"><div class="team-orbit">${teamMembers[locale].map((member, index) => {
        const position = teamPositions[index];
        const ariaLabel = member.role
          ? `${member.name}${locale === "zh" ? "，" : ", "}${member.role}`
          : member.name;
        return `<button class="team-member" type="button" data-member-index="${index}" style="left:${position.left};top:${position.top}" aria-label="${escapeHtml(ariaLabel)}"><span>${escapeHtml(member.name)}</span></button>`;
      }).join("")}</div></div><div class="team-detail-layer" aria-hidden="true"></div></section>`;
    }
    if (slide.type === "member-detail") {
      return memberDetailMarkup(slide.member);
    }
    const links = (slide.links || [])
      .map((link) => {
        const download = link.download ? ` download="${escapeHtml(link.download)}"` : "";
        const external = link.href.startsWith("http") ? ` target="_blank" rel="noreferrer"` : "";
        return `<a class="slide__link" href="${escapeHtml(link.href)}"${download}${external}>${escapeHtml(link.label)}</a>`;
      })
      .join("");
    const title = slide.title ? `<h1 class="slide__title">${escapeHtml(slide.title)}</h1>` : "";
    const body = slide.body ? `<p class="slide__body">${escapeHtml(slide.body)}</p>` : "";
    return `<article class="slide">${title}${body}${links ? `<div class="slide__links">${links}</div>` : ""}</article>`;
  }

  function memberDetailMarkup(member) {
    const role = member.role ? `<p class="member-detail__role">${escapeHtml(member.role)}</p>` : "";
    const lines = member.lines.length ? `<div class="member-detail__lines">${member.lines.map((line) => `<p>${escapeHtml(line)}</p>`).join("")}</div>` : "";
    return `<article class="member-detail"><h1 class="slide__title member-detail__name" tabindex="-1">${escapeHtml(member.name)}</h1>${role}${lines}</article>`;
  }

  function escapeHtml(value) {
    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function bindDynamicContent() {
    contentView.querySelectorAll(".team-member").forEach((memberButton) => {
      memberButton.addEventListener("click", (event) => {
        event.stopPropagation();
        openMember(Number(memberButton.dataset.memberIndex));
      });
    });
    const contactCanvas = contentView.querySelector(".contact-canvas");
    if (contactCanvas) {
      contactCanvas.addEventListener("input", () => {
        contactDraft = contactCanvas.textContent;
        contactCanvas.classList.toggle("contact-canvas--has-input", Boolean(contactCanvas.textContent.trim()));
      });
      contactCanvas.addEventListener("keydown", (event) => {
        if (event.key !== "Enter" || event.shiftKey) return;
        event.preventDefault();
        const message = contactCanvas.textContent.trim();
        if (!message) return;
        contactDraft = "";
        stepSection(1);
      });
    }
  }

  function waitForTeamTransition(duration, token) {
    if (reduceMotion.matches || duration <= 0) return Promise.resolve(token === teamTransitionToken);
    return new Promise((resolve) => {
      teamTransitionResolve = resolve;
      teamTransitionTimer = window.setTimeout(() => {
        teamTransitionTimer = null;
        teamTransitionResolve = null;
        resolve(token === teamTransitionToken);
      }, duration);
    });
  }

  function nextPaint() {
    return new Promise((resolve) => {
      window.requestAnimationFrame(() => window.requestAnimationFrame(resolve));
    });
  }

  function resetTeamTransition() {
    teamTransitionToken += 1;
    if (teamTransitionTimer !== null) {
      window.clearTimeout(teamTransitionTimer);
      teamTransitionTimer = null;
    }
    if (teamTransitionResolve) {
      teamTransitionResolve(false);
      teamTransitionResolve = null;
    }
    if (teamFlightAnimation) {
      teamFlightAnimation.cancel();
      teamFlightAnimation = null;
    }
    stage.querySelectorAll(".team-name-flight").forEach((node) => node.remove());
    contentView?.querySelectorAll(".team-member > span, .member-detail__name").forEach((node) => {
      node.style.removeProperty("visibility");
    });
    teamTransitionState = TEAM_STATE.ROSTER;
    stopTeamOrbit();
  }

  function mountTeamDetail(scene, index) {
    const layer = scene.querySelector(".team-detail-layer");
    const member = teamMembers[locale][index];
    if (!layer || !member) return null;
    layer.innerHTML = memberDetailMarkup(member);
    const title = layer.querySelector(".member-detail__name");
    title.style.visibility = "hidden";
    layer.classList.add("is-mounted");
    layer.classList.remove("is-revealed");
    return { layer, title };
  }

  function toStagePoint(element) {
    const rect = element.getBoundingClientRect();
    const stageRect = stage.getBoundingClientRect();
    const scaleX = stageRect.width / stage.offsetWidth;
    const scaleY = stageRect.height / stage.offsetHeight;
    return {
      x: (rect.left + rect.width / 2 - stageRect.left) / scaleX,
      y: (rect.top + rect.height / 2 - stageRect.top) / scaleY
    };
  }

  function fontMetrics(element) {
    const style = window.getComputedStyle(element);
    const number = (value, fallback) => Number.parseFloat(value) || fallback;
    return {
      fontFamily: style.fontFamily,
      fontWeight: style.fontWeight,
      fontSize: number(style.fontSize, 17),
      lineHeight: number(style.lineHeight, number(style.fontSize, 17) * 1.2),
      letterSpacing: number(style.letterSpacing, 0),
      color: style.color
    };
  }

  async function flyTeamName(fromElement, toElement, token) {
    const start = toStagePoint(fromElement);
    const end = toStagePoint(toElement);
    const fromFont = fontMetrics(fromElement);
    const toFont = fontMetrics(toElement);
    const ghost = document.createElement("span");
    ghost.className = "team-name-flight";
    ghost.setAttribute("aria-hidden", "true");
    ghost.textContent = fromElement.textContent;
    Object.assign(ghost.style, {
      left: `${start.x}px`,
      top: `${start.y}px`,
      color: fromFont.color,
      fontFamily: fromFont.fontFamily,
      fontWeight: fromFont.fontWeight,
      fontSize: `${fromFont.fontSize}px`,
      lineHeight: `${fromFont.lineHeight}px`,
      letterSpacing: `${fromFont.letterSpacing}px`
    });
    stage.appendChild(ghost);
    fromElement.style.visibility = "hidden";
    toElement.style.visibility = "hidden";

    if (reduceMotion.matches || typeof ghost.animate !== "function") {
      Object.assign(ghost.style, {
        left: `${end.x}px`,
        top: `${end.y}px`,
        fontSize: `${toFont.fontSize}px`,
        lineHeight: `${toFont.lineHeight}px`,
        letterSpacing: `${toFont.letterSpacing}px`
      });
      return token === teamTransitionToken;
    }

    teamFlightAnimation = ghost.animate([
      {
        left: `${start.x}px`, top: `${start.y}px`,
        fontSize: `${fromFont.fontSize}px`, lineHeight: `${fromFont.lineHeight}px`, letterSpacing: `${fromFont.letterSpacing}px`
      },
      {
        left: `${end.x}px`, top: `${end.y}px`,
        fontSize: `${toFont.fontSize}px`, lineHeight: `${toFont.lineHeight}px`, letterSpacing: `${toFont.letterSpacing}px`
      }
    ], {
      duration: 720,
      easing: "cubic-bezier(0.22, 0.75, 0.25, 1)",
      fill: "forwards"
    });
    await teamFlightAnimation.finished.catch(() => undefined);
    teamFlightAnimation = null;
    if (token !== teamTransitionToken) ghost.remove();
    return token === teamTransitionToken;
  }

  function finishTeamNameFlight(revealedElement) {
    revealedElement.style.removeProperty("visibility");
    stage.querySelector(".team-name-flight")?.remove();
  }

  async function openMember(index) {
    if (!teamMembers[locale][index] || teamTransitionState !== TEAM_STATE.ROSTER) return;
    const scene = contentView.querySelector(".team-scene");
    const selected = contentView.querySelector(`[data-member-index="${index}"]`);
    const sourceName = selected?.querySelector("span");
    if (!scene || !selected || !sourceName) return;

    const token = ++teamTransitionToken;
    teamTransitionState = TEAM_STATE.OPENING;
    teamMemberIndex = index;
    slideIndex = 0;
    stopTeamOrbit();
    const detail = mountTeamDetail(scene, index);
    if (!detail) return;
    selected.classList.add("team-member--selected");
    scene.classList.add("is-opening");
    scene.dataset.teamState = TEAM_STATE.OPENING;
    await nextPaint();
    if (token !== teamTransitionToken) return;
    const completed = await flyTeamName(sourceName, detail.title, token);
    if (!completed) return;

    finishTeamNameFlight(detail.title);
    scene.classList.add("is-detail");
    scene.classList.remove("is-opening");
    scene.dataset.teamState = TEAM_STATE.DETAIL;
    scene.querySelector(".team-roster")?.setAttribute("aria-hidden", "true");
    detail.layer.setAttribute("aria-hidden", "false");
    teamDetailOpen = true;
    teamTransitionState = TEAM_STATE.DETAIL;
    window.requestAnimationFrame(() => {
      if (token === teamTransitionToken) detail.layer.classList.add("is-revealed");
    });
    detail.title.focus({ preventScroll: true });
    announce(locale === "zh"
      ? `${teamMembers[locale][index].name}，成员详情`
      : `${teamMembers[locale][index].name}, member detail`);
  }

  function showTeamDetailInstant(index) {
    const scene = contentView.querySelector(".team-scene");
    const selected = contentView.querySelector(`[data-member-index="${index}"]`);
    const sourceName = selected?.querySelector("span");
    if (!scene || !selected || !sourceName) return;
    const detail = mountTeamDetail(scene, index);
    if (!detail) return;
    selected.classList.add("team-member--selected");
    sourceName.style.visibility = "hidden";
    detail.title.style.removeProperty("visibility");
    scene.classList.add("is-detail");
    scene.dataset.teamState = TEAM_STATE.DETAIL;
    scene.querySelector(".team-roster")?.setAttribute("aria-hidden", "true");
    detail.layer.setAttribute("aria-hidden", "false");
    detail.layer.classList.add("is-revealed");
    teamTransitionState = TEAM_STATE.DETAIL;
  }

  async function closeMember() {
    if (!teamDetailOpen || teamTransitionState !== TEAM_STATE.DETAIL) return false;
    const scene = contentView.querySelector(".team-scene");
    const layer = scene?.querySelector(".team-detail-layer");
    const title = layer?.querySelector(".member-detail__name");
    const selected = scene?.querySelector(`[data-member-index="${teamMemberIndex}"]`);
    const destinationName = selected?.querySelector("span");
    if (!scene || !layer || !title || !selected || !destinationName) return false;

    const token = ++teamTransitionToken;
    teamTransitionState = TEAM_STATE.CLOSING;
    scene.dataset.teamState = TEAM_STATE.CLOSING;
    layer.classList.remove("is-revealed");
    if (!await waitForTeamTransition(300, token)) return false;

    scene.classList.add("is-closing");
    scene.classList.remove("is-detail");
    scene.querySelector(".team-roster")?.setAttribute("aria-hidden", "false");
    // Give the roster's hidden state one paint before the return fade begins.
    // Without this boundary, the two classes can collapse into one frame.
    await nextPaint();
    if (token !== teamTransitionToken) return false;
    const flight = flyTeamName(title, destinationName, token);
    scene.classList.add("is-returning");
    if (!await flight) return false;

    finishTeamNameFlight(destinationName);
    selected.classList.remove("team-member--selected");
    scene.classList.remove("is-closing", "is-returning");
    scene.dataset.teamState = TEAM_STATE.ROSTER;
    layer.classList.remove("is-mounted");
    layer.setAttribute("aria-hidden", "true");
    layer.innerHTML = "";
    teamDetailOpen = false;
    teamTransitionState = TEAM_STATE.ROSTER;
    startTeamOrbit();
    announce(locale === "zh" ? "返回团队成员" : "Back to team members");
    return true;
  }

  function applyTeamOrbit(orbit, members, angle) {
    orbit.style.setProperty("--orbit-angle", `${angle}deg`);
    members.forEach((member) => member.style.setProperty("--counter-angle", `${-angle}deg`));
  }

  function startTeamOrbit() {
    const orbit = contentView.querySelector(".team-orbit");
    if (!orbit || teamTransitionState !== TEAM_STATE.ROSTER) return;
    stopTeamOrbit();
    const members = [...orbit.querySelectorAll(".team-member")];
    const startedAt = performance.now();
    const baseAngle = teamOrbitAngle;
    const duration = 60000;
    applyTeamOrbit(orbit, members, baseAngle);

    const tick = (now) => {
      if (!document.body.contains(orbit) || activeSection !== "team" || teamTransitionState !== TEAM_STATE.ROSTER) return;
      teamOrbitAngle = (baseAngle + ((now - startedAt) / duration) * 360) % 360;
      applyTeamOrbit(orbit, members, teamOrbitAngle);
      orbitAnimationFrame = window.requestAnimationFrame(tick);
    };

    orbitAnimationFrame = window.requestAnimationFrame(tick);
  }

  function stopTeamOrbit() {
    if (orbitAnimationFrame !== null) {
      window.cancelAnimationFrame(orbitAnimationFrame);
      orbitAnimationFrame = null;
    }
  }

  function updateHash() {
    const nextHash = `#${activeSection}`;
    if (window.location.hash !== nextHash) window.history.pushState({ section: activeSection }, "", nextHash);
  }

  function setSection(section, direction) {
    if (!sections.includes(section)) return;
    resetTeamTransition();
    activeSection = section;
    slideIndex = 0;
    teamDetailOpen = false;
    updateHash();
    renderNavigation();
    renderContent(direction);
    announce(pageAnnouncement(section, 1));
  }

  function stepSection(direction) {
    const order = navOrder();
    const index = order.indexOf(activeSection);
    const nextIndex = (index + direction + order.length) % order.length;
    setSection(order[nextIndex], direction);
  }

  function stepSlide(direction) {
    if (activeSection === "team" && teamTransitionState !== TEAM_STATE.ROSTER && teamTransitionState !== TEAM_STATE.DETAIL) return;
    if (activeSection === "team" && teamDetailOpen) {
      closeMember();
      return;
    }
    const slides = currentSlides();
    if (!slides.length) return;
    const nextIndex = slideIndex + direction;
    if (nextIndex >= 0 && nextIndex < slides.length) {
      slideIndex = nextIndex;
      renderContent(direction);
      announce(pageAnnouncement(activeSection, slideIndex + 1));
      return;
    }
    stepSection(direction);
    if (direction < 0) {
      slideIndex = currentSlides().length - 1;
      renderContent(direction);
    }
  }

  function handleWheel(event, region) {
    event.preventDefault();
    if (wheelLock) return;
    wheelAccumulator += event.deltaY;
    if (Math.abs(wheelAccumulator) < 24) return;
    const direction = wheelAccumulator > 0 ? 1 : -1;
    wheelAccumulator = 0;
    wheelLock = true;
    if (region === "nav") stepSection(direction);
    else stepSlide(direction);
    window.setTimeout(() => {
      wheelLock = false;
    }, 460);
  }

  function handleTouchStart(event) {
    touchStartY = event.touches[0]?.clientY ?? null;
  }

  function handleTouchEnd(event) {
    if (touchStartY === null) return;
    const endY = event.changedTouches[0]?.clientY ?? touchStartY;
    const delta = touchStartY - endY;
    touchStartY = null;
    if (Math.abs(delta) < 35 || wheelLock) return;
    suppressClickUntil = Date.now() + 520;
    wheelLock = true;
    stepSlide(delta > 0 ? 1 : -1);
    window.setTimeout(() => {
      wheelLock = false;
    }, 460);
  }

  function toggleLocale() {
    locale = locale === "zh" ? "en" : "zh";
    window.localStorage.setItem("clean-slate-locale", locale);
    languageChosen = true;
    window.localStorage.setItem("clean-slate-language-chosen", "1");
    languageControl.classList.add("is-hidden");
    languageControl.classList.remove("is-revealed");
    syncStaticLabels();
    document.title = copy[locale].pageTitle;
    languageButton.textContent = copy[locale].languageButton;
    languageButton.setAttribute("aria-label", copy[locale].languageAria);
    renderNavigation();
    renderContent();
    announce(locale === "zh" ? "已切换为中文" : "Switched to English");
  }

  function revealLanguage(temporary) {
    window.clearTimeout(languageRevealTimer);
    languageControl.classList.remove("is-hidden");
    languageControl.classList.add("is-revealed");
    if (temporary && languageChosen) {
      languageRevealTimer = window.setTimeout(() => {
        languageControl.classList.remove("is-revealed");
        languageControl.classList.add("is-hidden");
      }, 2300);
    }
  }

  function handleTyping(event) {
    if (introPhase !== "open") return;
    if (event.target.closest?.("input, textarea, [contenteditable='true']")) return;
    if (event.key.length !== 1 || !/[a-zA-Z中]/.test(event.key)) return;
    typingBuffer = `${typingBuffer}${event.key.toLowerCase()}`.slice(-3);
    window.clearTimeout(typingTimer);
    typingTimer = window.setTimeout(() => {
      typingBuffer = "";
    }, 800);
    if (typingBuffer.endsWith("en")) {
      if (locale !== "en") toggleLocale();
      typingBuffer = "";
    } else if (typingBuffer.endsWith("zh") || typingBuffer.endsWith("中")) {
      if (locale !== "zh") toggleLocale();
      typingBuffer = "";
    }
  }

  function handleKeydown(event) {
    if (introPhase !== "open") {
      const isInputTrigger = event.key.length === 1 || [
        "Enter", " ", "ArrowDown", "ArrowRight", "PageDown"
      ].includes(event.key);
      if (introPhase === "ready" && isInputTrigger && !event.ctrlKey && !event.metaKey && !event.altKey) {
        event.preventDefault();
        dismissIntro();
      }
      return;
    }
    if (event.target.closest?.("input, textarea, [contenteditable='true']")) return;
    const directions = {
      ArrowDown: 1,
      PageDown: 1,
      ArrowUp: -1,
      PageUp: -1
    };
    if (event.key in directions) {
      event.preventDefault();
      if (wheelLock) return;
      wheelLock = true;
      stepSlide(directions[event.key]);
      window.setTimeout(() => {
        wheelLock = false;
      }, 330);
      return;
    }
    if (event.key === "Home") {
      event.preventDefault();
      setSection(navOrder()[0], -1);
    }
    if (event.key === "End") {
      event.preventDefault();
      setSection(navOrder()[navOrder().length - 1], 1);
    }
  }

  function dismissIntro() {
    if (introPhase !== "ready") return;
    introPhase = "open";
    if (activeSection === "team" && !teamDetailOpen) startTeamOrbit();
    stage.classList.add("intro-leaving");
    stage.classList.remove("intro-active");
    introScreen.classList.add("is-dismissed");
    introScreen.setAttribute("aria-hidden", "true");
    window.setTimeout(() => {
      introScreen.hidden = true;
      stage.classList.remove("intro-leaving");
    }, reduceMotion.matches ? 0 : 820);
    announce(locale === "zh" ? "开场完成，点击正文开始探索" : "Opening complete, click the page to explore");
  }

  function initializeIntro() {
    stage.classList.add("intro-active");
    introScreen.addEventListener("click", () => dismissIntro());
    introScreen.addEventListener("wheel", (event) => {
      event.preventDefault();
      dismissIntro();
    }, { passive: false });
    introScreen.addEventListener("pointerdown", () => {
      if (introPhase === "ready") dismissIntro();
    });
    const animationDuration = reduceMotion.matches ? 900 : 2450;
    window.setTimeout(() => {
      if (introPhase !== "animating") return;
      introPhase = "ready";
      introScreen.classList.add("is-ready");
      introHint.textContent = locale === "zh" ? "点击或输入以继续" : "Click or type to continue";
    }, animationDuration);
  }

  function initialize() {
    syncStageScale();
    syncStaticLabels();
    languageButton.textContent = copy[locale].languageButton;
    languageButton.setAttribute("aria-label", copy[locale].languageAria);
    if (languageChosen) languageControl.classList.add("is-hidden");
    renderNavigation();
    renderContent();
    initializeIntro();

    contentZone.addEventListener("wheel", (event) => handleWheel(event, "content"), { passive: false });
    navZone.addEventListener("wheel", (event) => handleWheel(event, "nav"), { passive: false });
    contentZone.addEventListener("touchstart", handleTouchStart, { passive: true });
    contentZone.addEventListener("touchend", handleTouchEnd, { passive: true });
    contentZone.addEventListener("click", (event) => {
      if (Date.now() < suppressClickUntil) return;
      if (event.target.closest("a, .contact-canvas")) return;
      if (wheelLock) return;
      if (activeSection === "team" && teamTransitionState !== TEAM_STATE.ROSTER && teamTransitionState !== TEAM_STATE.DETAIL) return;
      if (activeSection === "team" && teamDetailOpen) {
        closeMember();
        return;
      }
      wheelLock = true;
      stepSlide(1);
      window.setTimeout(() => {
        wheelLock = false;
      }, 330);
    });
    window.addEventListener("resize", syncStageScale);
    window.addEventListener("keydown", handleKeydown);
    window.addEventListener("keydown", handleTyping);
    window.addEventListener("popstate", () => {
      const section = getSectionFromHash();
      if (section) setSection(section);
    });
    window.addEventListener("hashchange", () => {
      const section = getSectionFromHash();
      if (section) setSection(section);
    });
    languageButton.addEventListener("click", toggleLocale);
    languageHotspot.addEventListener("pointerenter", () => revealLanguage(true));
    languageHotspot.addEventListener("focus", () => revealLanguage(true));
    languageHotspot.addEventListener("click", (event) => {
      if (event.target === languageHotspot) revealLanguage(true);
    });
    languageHotspot.addEventListener("keydown", (event) => {
      if (event.target !== languageHotspot) return;
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        revealLanguage(true);
      }
    });
    window.setTimeout(() => {
      if (!languageChosen) {
        languageChosen = true;
        languageControl.classList.add("is-hidden");
      }
    }, 60000);
  }

  initialize();
})();

    </script>
